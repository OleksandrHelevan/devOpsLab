{{- if and .Values.rollout.enabled .Values.rollout.strategy.blueGreen }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "orders.fullname" . }}-preview
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "orders.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "orders.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
{{- end }}
