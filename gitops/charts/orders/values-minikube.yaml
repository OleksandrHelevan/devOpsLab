replicaCount: 8

image:
  repository: devopslab/orders
  tag: "1.2.0"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP

config:
  appEnv: minikube
  logLevel: DEBUG
  ordersRegion: local

secret:
  existingSecret: orders-secret

hooks:
  preUpgrade:
    enabled: false
tests:
  enabled: false

env:
  - name: FAIL_RATE
    value: "0"

metrics:
  enabled: true
  path: /metrics

rollout:
  enabled: true
  analysis:
    enabled: true
    prometheusAddress: http://kps-prometheus.monitoring:9090
    selector: 'namespace="orders"'
  strategy:
    canary:
      steps:
        - setWeight: 20
        - pause: {duration: 30s}
        - analysis:
            templates:
              - templateName: orders-success-rate
        - setWeight: 60
        - pause: {duration: 30s}
