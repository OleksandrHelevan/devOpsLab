apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: orders
  namespace: devopslab
  labels:
    app.kubernetes.io/name: orders
    app.kubernetes.io/part-of: devopslab
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: orders
                port:
                  number: 8001
