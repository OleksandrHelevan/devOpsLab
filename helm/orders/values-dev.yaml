# Середовище розробки: helm install orders-dev ./helm/orders -n orders-dev --create-namespace -f helm/orders/values-dev.yaml
replicaCount: 1

image:
  tag: "1.0.0"

service:
  type: NodePort

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 128Mi

config:
  appEnv: development
  logLevel: DEBUG
  ordersRegion: local

ingress:
  enabled: false
