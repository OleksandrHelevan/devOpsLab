# Значення за замовчуванням відповідають середовищу розробки (dev).
# Пріоритет: values.yaml < -f <файл> (зліва направо) < --set / --set-string.

replicaCount: 1
revisionHistoryLimit: 5

image:
  repository: devopslab/orders
  # Порожній тег => використовується .Chart.AppVersion
  tag: ""
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

service:
  type: NodePort
  port: 8001
  # Порожнє значення => Kubernetes призначить nodePort автоматично
  # (фіксований порт заважав би встановити чарт двічі в один кластер).
  nodePort: ""

containerPort: 8001

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 128Mi

# Параметри конфігурації застосунку (потрапляють у ConfigMap)
config:
  appEnv: development
  logLevel: DEBUG
  ordersRegion: local

# Значення для Secret. Реальні паролі тут НЕ зберігаються:
#  - apiToken порожній => токен генерується під час install і зберігається при upgrade;
#  - або передайте його через --set secret.apiToken=... / змінну середовища CI;
#  - або вкажіть existingSecret з уже створеним у кластері Secret.
secret:
  apiToken: ""
  existingSecret: ""

ingress:
  enabled: false
  className: nginx
  host: ""
  path: /
  pathType: Prefix
  annotations: {}

persistence:
  enabled: false
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  size: 1Gi
  mountPath: /data

strategy:
  maxSurge: 1
  maxUnavailable: 0

terminationGracePeriodSeconds: 10

probes:
  path: /health
  liveness:
    initialDelaySeconds: 10
    periodSeconds: 10
  readiness:
    initialDelaySeconds: 3
    periodSeconds: 5

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

# Завдання 9b: хук pre-upgrade і тест релізу
hooks:
  preUpgrade:
    enabled: true
    image: busybox:1.36
tests:
  image: busybox:1.36
