

replicaCount: 1
revisionHistoryLimit: 5

image:
  repository: devopslab/orders
  tag: ""
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

service:
  type: NodePort
  port: 8001

  nodePort: ""

containerPort: 8001

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 128Mi

config:
  appEnv: development
  logLevel: DEBUG
  ordersRegion: local

secret:
  apiToken: ""
  existingSecret: ""

ingress:
  enabled: false
  className: nginx
  host: ""
  path: /
  pathType: Prefix
  annotations: {}

persistence:
  enabled: false
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  size: 1Gi
  mountPath: /data

strategy:
  maxSurge: 1
  maxUnavailable: 0

terminationGracePeriodSeconds: 10

probes:
  path: /health
  liveness:
    initialDelaySeconds: 10
    periodSeconds: 10
  readiness:
    initialDelaySeconds: 3
    periodSeconds: 5

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

hooks:
  preUpgrade:
    enabled: true
    image: busybox:1.36
tests:
  image: busybox:1.36
