{{- if .Values.hooks.preUpgrade.enabled }}
# Хук pre-upgrade: перед оновленням перевіряє, що поточна версія релізу відповідає на /health.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "orders.fullname" . }}-pre-upgrade
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "orders.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 120
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "orders.name" . }}-hook
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: pre-upgrade-hook
    spec:
      restartPolicy: Never
      containers:
        - name: pre-upgrade-check
          image: {{ .Values.hooks.preUpgrade.image }}
          command:
            - /bin/sh
            - -c
            - >-
              echo "Pre-upgrade: release={{ .Release.Name }} revision={{ .Release.Revision }} target={{ include "orders.image" . }}" &&
              wget -qO- http://{{ include "orders.fullname" . }}:{{ .Values.service.port }}{{ .Values.probes.path }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
{{- end }}
