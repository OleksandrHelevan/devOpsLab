{{- if not .Values.secret.existingSecret }}
{{- $secretName := include "orders.secretName" . }}
{{- $token := .Values.secret.apiToken }}
{{- if not $token }}
{{- /* Значення не передано: беремо вже збережене в кластері або генеруємо нове */}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- if and $existing $existing.data (hasKey $existing.data "ORDERS_API_TOKEN") }}
{{- $token = index $existing.data "ORDERS_API_TOKEN" | b64dec }}
{{- else }}
{{- $token = randAlphaNum 32 }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "orders.labels" . | nindent 4 }}
type: Opaque
data:
  ORDERS_API_TOKEN: {{ $token | b64enc | quote }}
{{- end }}
